# gitleaks configuration — virtus
#
# Goal: a clean scan that still fails on a real credential. The noise here has two shapes, and both are
# removed by narrow scope, never by disabling a detector outright:
#
#   1. SOURCE CODE. `generic-api-key` is a shape heuristic; in .py/.js/.ts it matches identifiers
#      (HANDOFF_KEY_INFO, session_key: 'durable-key-123', api_key=). 183 findings, zero credentials.
#      It is disabled for source files only. Every known-format rule (github-pat, gitlab-pat, stripe,
#      private-key, gcp, jwt, discord client id/secret, mattermost, grafana) still runs on source, and
#      `generic-api-key` still runs on .env, .yaml, .json, .toml, .ini — the files an unknown-format
#      key actually lands in.
#
#   2. FIXTURES AND DOCS. The redaction tests must contain shape-correct FAKE secrets, and the docs
#      show `Authorization: …` and `MATTERMOST_ALLOWED_USERS=@you` examples. Those paths are listed
#      explicitly below, one target per line, so a real key anywhere else still fails.
#
# Run before the first push, over history as well:   gitleaks git

[extend]
useDefault = true

[[allowlists]]
description = "redaction / credential test fixtures — fake by design"
paths = [
  '''tests/agent/test_redact.*\.py$''',
  '''tests/fixtures/provider_wire_snapshot.*\.json$''',
  '''tests/gateway/test_standalone_send_redaction\.py$''',
  '''tests/gateway/test_discord_connect_username_access\.py$''',
  '''tests/gateway/test_discord_plugin_setup\.py$''',
  '''tests/hermes_cli/test_approvals_suggest\.py$''',
  '''tests/tui_gateway/.*\.py$''',
]

[[allowlists]]
description = "documentation examples: placeholder tokens, not credentials"
paths = [
  '''website/docs/.*\.md$''',
  '''website/i18n/.*\.md$''',
  '''docs/.*\.md$''',
]

[[allowlists]]
description = "curl -H 'Authorization: …' examples inside tests"
paths = ['''tests/.*\.py$''','''tests/.*\.json$''']

[[allowlists]]
description = "generated / cache paths that never ship"
paths = [
  '''\.pytest_cache/''',
  '''__pycache__/''',
  '''\.venv/''',
  '''node_modules/''',
]

# The shape heuristic off for source files only (see header). Known-format rules keep running there.
[[rules]]
id = "generic-api-key"
  [rules.allowlist]
  description = "generic-api-key matches identifiers in source, not credentials"
  paths = ['''\.py$''', '''\.js$''', '''\.ts$''', '''\.tsx$''', '''\.mjs$''']
